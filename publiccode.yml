description:
  nl:
    localisedName: MOZa wallet testomgeving
    shortDescription: >-
      Dummy wallet gebaseerd op NL Wallet, als testomgeving voor inloggen op
      MijnOverheid Zakelijk (MOZa).
    longDescription: >
      Deze testomgeving zet de lokale ontwikkelomgeving van NL Wallet online
      op het ZAD-platform, zodat een zelfgebouwde NL Wallet-app kan onboarden,
      een PID kan ophalen via een mock-DigiD, een fictieve KVK-bevoegdheid kan
      krijgen en kan inloggen op MijnOverheid Zakelijk. Alles werkt met
      fictieve testpersonen en testsleutels.


      Deze repository bevat de containers, de configuratie en de workflow
      voor die omgeving. Het MOZa-project bestaat uit meerdere repositories
      binnen de MinBZK organisatie, te herkennen aan de moza- prefix of
      het topic mijnoverheidzakelijk.
    features:
      - NL Wallet-services (wallet_provider, pid_issuer, issuance_server, verification_server) in één container
      - Mock-DigiD en mock-BRP met fictieve testpersonen
      - KVK-bevoegdheid als attestatie van een fictieve uitgever
      - Publieke https-adressen per dienst via ZAD
  en:
    shortDescription: >-
      Dummy wallet based on NL Wallet, as a test environment for logging in to
      "MijnOverheid Zakelijk" (MOZa).
    longDescription: >
      This test environment runs the local development environment of NL
      Wallet on the ZAD platform, so that a self-built NL Wallet app can
      onboard, obtain a PID through a mock DigiD, receive a fictitious
      chamber-of-commerce authorisation and log in to "MijnOverheid
      Zakelijk". Everything uses fictitious test persons and test keys.


      This repository contains the containers, configuration and workflow
      for that environment. The MOZa project consists of multiple
      repositories within the MinBZK organisation, identifiable by the
      moza- prefix or the mijnoverheidzakelijk topic.
    features:
      - NL Wallet services (wallet_provider, pid_issuer, issuance_server, verification_server) in one container
      - Mock DigiD and mock BRP with fictitious test persons
      - Chamber-of-commerce authorisation as an attestation from a fictitious issuer
      - Public https addresses per service through ZAD
